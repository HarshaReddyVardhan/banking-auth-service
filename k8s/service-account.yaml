apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-auth-service
  namespace: banking
  labels:
    app: banking-auth-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-auth-service-role
  namespace: banking
rules:
  # Only allow reading secrets needed for JWT keys
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["banking-auth-jwt-keys", "banking-auth-secrets"]
    verbs: ["get"]
  # Allow reading configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["banking-auth-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-auth-service-rolebinding
  namespace: banking
subjects:
  - kind: ServiceAccount
    name: banking-auth-service
    namespace: banking
roleRef:
  kind: Role
  name: banking-auth-service-role
  apiGroup: rbac.authorization.k8s.io
