apiVersion: v1
kind: Secret
metadata:
  name: banking-auth-jwt-keys
  namespace: banking
  labels:
    app: banking-auth-service
    component: security
    managed-by: manual
  annotations:
    description: "RSA 3072-bit key pair for JWT signing"
    rotation-schedule: "Every 90 days"
    last-rotated: "YYYY-MM-DD"
type: Opaque
immutable: true
# ═══════════════════════════════════════════════════════════════════════════
# IMPORTANT: Replace placeholders with actual base64-encoded keys
#
# Generate keys:
#   openssl genrsa -out keys/private.pem 3072
#   openssl rsa -in keys/private.pem -pubout -out keys/public.pem
#
# Encode for Kubernetes (single-line base64):
#   cat keys/private.pem | base64 -w 0
#   cat keys/public.pem | base64 -w 0
#
# Or use kubectl directly (recommended - never stores keys in YAML):
#   kubectl create secret generic banking-auth-jwt-keys \
#     --from-file=private.pem=./keys/private.pem \
#     --from-file=public.pem=./keys/public.pem \
#     -n banking
# ═══════════════════════════════════════════════════════════════════════════
data:
  # ⚠️ PLACEHOLDER - Replace with base64-encoded 3072-bit RSA private key
  private.pem: "UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX1BSSVZBVEVfS0VZ"
  # ⚠️ PLACEHOLDER - Replace with base64-encoded RSA public key
  public.pem: "UkVQTEFDRV9XSVRIX0JBU0U2NF9FTkNPREVEX1BVQkxJQ19LRVk="

---
apiVersion: v1
kind: Secret
metadata:
  name: banking-auth-secrets
  namespace: banking
  labels:
    app: banking-auth-service
    component: security
    managed-by: manual
  annotations:
    description: "Application secrets for database, redis, encryption"
type: Opaque
# ═══════════════════════════════════════════════════════════════════════════
# IMPORTANT: Replace placeholders with actual base64-encoded values
#
# Generate strong values:
#   DB_PASSWORD:         openssl rand -base64 32
#   REDIS_PASSWORD:      openssl rand -base64 32
#   FIELD_ENCRYPTION_KEY: openssl rand -hex 32 (64 hex chars for AES-256)
#
# Encode for Kubernetes:
#   echo -n "your_password" | base64
#
# Or use kubectl directly (recommended):
#   kubectl create secret generic banking-auth-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=FIELD_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=SMTP_PASSWORD="your_smtp_password" \
#     --from-literal=HIBP_API_KEY="your_hibp_key" \
#     -n banking
# ═══════════════════════════════════════════════════════════════════════════
data:
  # ⚠️ PLACEHOLDER - Replace with strong 32+ character password (base64)
  DB_PASSWORD: "UkVQTEFDRV9XSVRIX1NUUk9OR19QQVNTV09SRA=="
  # ⚠️ PLACEHOLDER - Replace with strong 32+ character password (base64)
  REDIS_PASSWORD: "UkVQTEFDRV9XSVRIX1NUUk9OR19QQVNTV09SRA=="
  # ⚠️ PLACEHOLDER - Replace with 64 hex chars for AES-256 (base64)
  FIELD_ENCRYPTION_KEY: "UkVQTEFDRV9XSVRIXzY0X0hFWF9DSEFSUw=="
  # SMTP password from your email provider (base64)
  SMTP_PASSWORD: ""
  # HaveIBeenPwned API key - optional (base64)
  HIBP_API_KEY: ""
